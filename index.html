<style>
:root{--bg:#f2f4f9;--card:#fff;--soft:#eaedf5;--ink:#101627;--mute:#5b6479;--line:#e0e4ee;--acc:#e4540a;--acc-ink:#fff;--ok:#0f8a5f;--warn:#b86e00;--bad:#c8352c;--r:16px;--sh:0 10px 30px -12px rgba(16,22,39,.25);--hf:'Bricolage Grotesque','Barlow Condensed',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c1222;--card:#141c31;--soft:#1b2540;--ink:#eef1f8;--mute:#9aa5bd;--line:#232d48;--acc:#ff8a3d;--acc-ink:#1a0e05;--ok:#43d3a0;--warn:#f2b84b;--bad:#ff6b61;--sh:0 14px 34px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Instrument Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header:before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header b{display:flex;align-items:center;gap:10px;font:800 22px var(--hf);letter-spacing:-.01em;margin-right:auto}
header b:before{content:"";width:12px;height:22px;border-radius:4px;background:var(--acc);transform:skewX(-12deg)}
nav{display:flex;gap:4px}
nav a,.link{color:var(--mute);text-decoration:none;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;background:none;border:0;font-family:inherit;font-size:inherit;transition:background .15s,color .15s}
nav a:hover,.link:hover{background:var(--soft);color:var(--ink)}
nav a.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
nav a .ic{display:none}
#who{font-weight:600;font-size:14px}
main{max-width:720px;margin:0 auto;padding:28px 16px 90px}
#app.wide{max-width:980px}
h1{font:800 clamp(34px,7vw,52px)/1.02 var(--hf);letter-spacing:-.03em;margin:6px 0 8px}
h2{font:700 22px var(--hf);letter-spacing:-.02em;margin:30px 0 10px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
a.card.item:hover{border-color:var(--acc)}
button,.btn{font:600 16px 'Instrument Sans',sans-serif;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:filter .15s,background .15s,transform .1s}
button:hover:not(:disabled),.btn:hover{filter:brightness(1.07)}
button:active:not(:disabled),.btn:active{transform:scale(.98)}
button.alt,.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.alt:hover:not(:disabled),.btn.alt:hover{background:var(--soft);filter:none}
button.del{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);padding:8px 14px}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;width:100%;transition:border-color .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.8}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc);background:var(--card)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 90px}.row.nowrap{flex-wrap:nowrap}
.tag{font-size:14px;font-weight:600;color:var(--ok)}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s cubic-bezier(.3,.8,.3,1)}
.ex{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0;padding-top:4px}.ex:last-child{padding-bottom:4px}
.ex input[type=checkbox]{-webkit-appearance:none;appearance:none;display:grid;place-content:center;width:30px;height:30px;padding:0;flex:none;margin-top:1px;border-radius:10px;border:2px solid var(--line);background:var(--soft);cursor:pointer;transition:background .15s,border-color .15s}
.ex input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
.ex input[type=checkbox]:after{content:"";width:7px;height:13px;border:solid var(--acc-ink);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s}
.ex input[type=checkbox]:checked:after{transform:rotate(45deg) scale(1)}
.ex.done .nm{text-decoration:line-through;color:var(--mute)}
.nm{font:700 19px/1.25 var(--hf);letter-spacing:-.01em}
.ex .w{margin-top:8px;padding:8px 12px;font-size:15px}
.last{font-size:14px;color:var(--ok);font-weight:600}.last:empty{display:none}
.vid{display:inline-block;margin-top:8px;padding:7px 13px;border-radius:99px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:600;font-size:14px;text-decoration:none}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 calc(12px + env(safe-area-inset-bottom));margin:0}
.bd{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 7px;margin-left:6px;line-height:1.5}
.bub{max-width:84%;padding:10px 15px;border-radius:20px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{margin-left:auto;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.bub.ot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub small{display:block;opacity:.7;font-size:12px;margin-top:2px}
.day{text-align:center;color:var(--mute);font-size:13px;margin:16px 0 4px}
.comp{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:12px 0;margin-top:12px}
.comp textarea{flex:1;resize:none;max-height:140px}
.x{background:none;border:0;color:inherit;opacity:.85;text-decoration:underline;padding:0;font:inherit;font-size:12px;border-radius:0;cursor:pointer}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:8px 0 16px;gap:2px}
.seg a{flex:1;text-align:center;padding:9px 6px;border-radius:10px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;transition:background .15s}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chead{display:flex;align-items:center;gap:8px;margin:8px 0}
.chead h2{margin:0;flex:1;text-transform:capitalize}
.chead button{min-height:44px;min-width:44px;padding:8px 12px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cw{font-size:12px;font-weight:600;color:var(--mute);text-align:center;padding:4px 0}
.cd{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:60px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;cursor:pointer}
.cd:hover{border-color:var(--acc);filter:none}
.cd.other{opacity:.35}
.cd.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cd.today .n{background:var(--acc);color:var(--acc-ink)}
.n{font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.dots{display:flex;gap:3px;justify-content:center;min-height:8px}
.d{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.d.done{background:var(--ok)}.d.part{background:var(--warn)}.d.miss{background:var(--mute);opacity:.6}
.ct{display:none}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:14px 0}.leg .d{margin-right:5px;vertical-align:middle}
.st-done{color:var(--ok)}.st-part{color:var(--warn)}.st-miss{color:var(--mute)}.st-plan{color:var(--acc)}
@media(min-width:700px){
 .cd{min-height:108px;align-items:stretch;padding:7px}
 .n{align-self:flex-start}.dots{display:none}
 .ct{display:block;font-size:12px;font-weight:600;text-align:left;padding:3px 7px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ct.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.ct.part{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}.ct.miss{background:var(--soft);color:var(--mute)}
}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.6);backdrop-filter:blur(3px);display:grid;place-items:end center;z-index:50}
.sheet{background:var(--card);width:min(520px,100%);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:var(--sh)}
@media(min-width:601px){.modal{place-items:center}.sheet{border-radius:24px}}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:99px;padding:6px 8px 6px 14px;margin:8px 8px 0 0}.chip .x{padding:6px;text-decoration:none}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:14px;margin:0 0 14px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}.pw button{flex:none;min-height:44px}
.usr{display:flex;gap:14px;align-items:center}
.av{width:48px;height:48px;border-radius:16px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);display:grid;place-items:center;font:800 22px var(--hf);flex:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font:800 40px/1 var(--hf);letter-spacing:-.03em}.stat span{color:var(--mute);font-size:14px}
.wk{display:flex;gap:8px;height:130px;margin:10px 0 4px}
.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.wk em{font-style:normal;font-size:12px;color:var(--mute)}
.wk i{display:block;width:100%;background:var(--soft);border-radius:8px;min-height:4px}.wk i.now{background:var(--acc)}
.wkl{display:flex;gap:8px}.wkl span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.lc{width:100%;height:auto;display:block}
.lc-line{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lc-dot{fill:var(--acc)}.lc-pr{fill:var(--ok)}.lc-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.lc-txt{fill:var(--mute);font-size:10px}
.inst{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
body.out header{display:none}
.hero{max-width:520px;margin:0 auto;padding-top:max(4vh,16px)}
.hero .bell{width:92px;color:var(--acc);margin-bottom:14px}
.kicker{font-weight:600;font-size:15px;color:var(--acc)}
.hero h1{font-size:clamp(44px,13vw,72px);margin:8px 0 14px}
.lead{font-size:18px;color:var(--mute);margin:0 0 26px}
.keep{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-weight:600;font-size:15px;cursor:pointer}.keep input{width:22px;height:22px;padding:0;flex:none;accent-color:var(--acc)}.keep span{color:var(--ink)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:14px;font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.15)}.gbtn:disabled{opacity:.7}
.fine{font-size:13px;color:var(--mute);margin:10px 0 22px;text-align:center}
.hero #emailbox{margin:0 0 30px}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.feat li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.feat b{display:block;font:700 19px var(--hf);letter-spacing:-.01em}.feat span{color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hero>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.hero>*:nth-child(2){animation-delay:.05s}.hero>*:nth-child(3){animation-delay:.1s}.hero>*:nth-child(4){animation-delay:.15s}.hero>*:nth-child(n+5){animation-delay:.2s}

.nprev .nb{font-size:26px}.nprev span{font-size:14px;opacity:.85}
.dc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dc button{background:var(--soft);color:var(--ink);min-height:42px;padding:6px 14px;border-radius:99px;font-size:15px}
.dc button.on{background:var(--acc);color:var(--acc-ink)}
.lp-a{grid-area:a}.lp-p{grid-area:p}.lp-f{grid-area:f}
.lp-grid{grid-template-areas:"a" "p" "f"}
@media(min-width:860px){.lp-grid{grid-template-columns:1.05fr .95fr;grid-template-areas:"a p" "f p";align-items:start}}
.lp #emailbox{margin:0 0 10px}
body.onb nav,body.onb #me{display:none!important}
.sw{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:16px;font-weight:400;font-size:16px}
.sw.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.sw .tx{flex:1;min-width:0}.sw b{display:block;font:700 19px var(--hf);letter-spacing:-.01em}.sw .mute{display:block;margin-top:4px;font-size:15px}
.sw .tg{flex:none;position:relative;width:56px;height:32px;border-radius:99px;background:var(--line);transition:background .2s}
.sw .tg:after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on .tg{background:var(--acc)}.sw.on .tg:after{transform:translateX(24px)}
/* ===== Écran de chargement ===== */
#splash{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:26px;transition:opacity .45s ease,visibility .45s}
#splash.sp-off{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-logo{width:112px;height:112px;border-radius:28px;display:block;box-shadow:0 18px 40px -14px rgba(37,73,255,.65);animation:spLift 1.3s cubic-bezier(.45,0,.25,1) infinite}
#splash .sp-sh{width:84px;height:12px;border-radius:50%;background:rgba(16,22,39,.28);filter:blur(5px);margin-top:-10px;animation:spSh 1.3s cubic-bezier(.45,0,.25,1) infinite}
#splash .sp-name{display:flex;align-items:center;gap:10px;font:800 24px var(--hf);letter-spacing:.04em;color:var(--ink)}
#splash .sp-name:before{content:"";width:11px;height:22px;border-radius:4px;background:var(--acc);transform:skewX(-12deg)}
#splash .sp-bar{width:140px;height:5px;border-radius:99px;background:var(--soft);overflow:hidden}
#splash .sp-bar i{display:block;width:45%;height:100%;border-radius:99px;background:var(--acc);animation:spBar 1.1s ease-in-out infinite}
@keyframes spLift{0%,100%{transform:translateY(8px) scale(.97)}45%{transform:translateY(-14px) scale(1.04) rotate(-2deg)}}
@keyframes spSh{0%,100%{transform:scale(1);opacity:.9}45%{transform:scale(.7);opacity:.45}}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
@media(prefers-reduced-motion:reduce){#splash .sp-logo,#splash .sp-sh{animation:none}#splash .sp-bar i{animation-duration:2.4s}}
/* ===== Studio de partage ===== */
.shm{position:fixed;inset:0;z-index:250;background:rgba(5,8,18,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:end center}
.shs{background:var(--card);color:var(--ink);width:min(560px,100%);height:min(94dvh,100%);max-height:94dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}
@media(prefers-reduced-motion:no-preference){.shs{animation:shu .24s cubic-bezier(.2,.8,.3,1)}@keyframes shu{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}}
.shp{flex:none;display:grid;place-items:center;padding:14px 16px;background:color-mix(in srgb,var(--ink) 7%,var(--card));border-bottom:1px solid var(--line)}
.shw{line-height:0;border-radius:16px;overflow:hidden;box-shadow:0 14px 34px -14px rgba(0,0,0,.55)}
.shw.chk{background:conic-gradient(#8b93a7 25%,#c6ccda 0 50%,#8b93a7 0 75%,#c6ccda 0) 0 0/20px 20px}
.shw canvas{display:block;width:auto;height:auto;max-width:100%;max-height:38dvh}
.shr{display:flex;flex-direction:column;min-height:0;flex:1}
.shh{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 4px}
.shh b{font:800 22px var(--hf);letter-spacing:-.02em}
.shh button{padding:0;width:40px;height:40px;border-radius:50%}
.shb{flex:1;overflow:auto;padding:0 18px 12px;overscroll-behavior:contain}
.shl{display:block;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.shseg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.shseg button{flex:1;background:none;color:var(--mute);padding:8px 6px;border-radius:10px;font-size:15px;display:grid;line-height:1.2}
.shseg button small{font-weight:500;font-size:12px;opacity:.8}
.shseg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.shth{display:flex;gap:10px;flex-wrap:wrap}
.shth button{display:grid;gap:6px;justify-items:center;background:none;color:var(--mute);padding:4px;font-size:13px;font-weight:600;width:64px;border-radius:14px}
.shth button[aria-pressed=true]{color:var(--ink)}
.shth i{display:block;width:52px;height:52px;border-radius:16px;border:2px solid var(--line)}
.shth button[aria-pressed=true] i{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.sw-night{background:linear-gradient(145deg,#1d2848,#080c18)}
.sw-fire{background:linear-gradient(145deg,#ff8a3d,#a8330a)}
.sw-light{background:linear-gradient(145deg,#fff,#dfe5f1)}
.sw-photo{background:linear-gradient(160deg,rgba(0,0,0,.1),rgba(0,0,0,.7)),linear-gradient(120deg,#5b8def,#e4540a)}
.sw-sticker{background:conic-gradient(#8b93a7 25%,#c6ccda 0 50%,#8b93a7 0 75%,#c6ccda 0) 0 0/12px 12px}
.shn{font-size:13px;margin:10px 0 0;line-height:1.45}
.shtg{display:flex;align-items:center;gap:12px;margin:0;padding:9px 0;font-weight:500;font-size:16px;cursor:pointer;position:relative}
.shtg input{position:absolute;opacity:0;width:1px;height:1px;padding:0;margin:0}
.shsw{width:46px;height:28px;border-radius:99px;background:var(--soft);border:1px solid var(--line);position:relative;flex:none;transition:background .15s,border-color .15s}
.shsw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:left .15s,background .15s}
.shtg input:checked+.shsw{background:var(--acc);border-color:var(--acc)}
.shtg input:checked+.shsw:after{left:21px;background:var(--acc-ink)}
.shtg input:focus-visible+.shsw{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
#shcap{resize:vertical;min-height:84px;font-size:15px;line-height:1.45}
.shlk{display:flex;gap:8px;flex-wrap:wrap}
.shlk a{flex:1 1 auto;text-align:center;text-decoration:none;color:var(--ink);background:var(--soft);font-weight:600;font-size:15px;padding:10px 14px;border-radius:12px;transition:background .15s}
.shlk a:hover{background:color-mix(in srgb,var(--acc) 16%,var(--soft))}
.sha{flex:none;padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sha .row{gap:8px}.sha .row>*{flex:1 1 0;padding-left:10px;padding-right:10px;font-size:15px}
.sha #shgo{flex:1.5 1 0}
.shm2{margin:0 0 8px;min-height:20px;font-size:14px;font-weight:600;color:var(--ok)}
@media(min-width:860px){
  .shm{place-items:center}
  .shs{width:min(1040px,94vw);height:min(86vh,820px);max-height:92vh;border-radius:24px;flex-direction:row}
  .shp{flex:1 1 0;min-width:0;border-bottom:0;border-right:1px solid var(--line);padding:24px}
  .shw canvas{max-height:calc(min(86vh,820px) - 48px)}
  .shr{flex:0 0 420px}
}
.hshr{white-space:nowrap}

/* compteur discret : « X s’entraînent » */
#live{display:inline-flex;align-items:center;gap:6px;margin-left:4px;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap;user-select:none;-webkit-user-select:none;cursor:default}
#live[hidden]{display:none}
#live #liveN{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
#live .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent);animation:livep 2.4s infinite}
@keyframes livep{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){#live .dot{animation:none}}
@media(max-width:600px){#live{margin-left:auto;font-size:12px;padding:4px 9px}header #me{margin-left:0}}
</style>

// ----- Chrono de repos, écran allumé -----
let rt = null, wl = null;
const parseRest = t => { t = String(t || '').toLowerCase(); let m = /(\d+)\s*(?:min|m|')\s*(\d+)?/.exec(t); if (m) return +m[1] * 60 + (+m[2] || 0); m = /(\d+):(\d{2})/.exec(t); if (m) return +m[1] * 60 + +m[2]; m = /(\d+)/.exec(t); return m ? +m[1] : 0; };
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(c.currentTime + .35); } catch (e) {} }
function stopRest() { if (rt) { clearInterval(rt.i); rt = null; } const el = $('#rt'); if (el) el.remove(); }
function startRest(sec, label) {
  stopRest();
  const el = document.createElement('div'); el.id = 'rt'; el.className = 'rt'; el.setAttribute('role', 'timer');
  el.innerHTML = '<div><b id="rtt">0:00</b><span id="rtl"></span></div><button class="alt" id="rtm">−15 s</button><button class="alt" id="rtp">+15 s</button><button id="rtx" aria-label="Arrêter le repos">✕</button>';
  document.body.appendChild(el);
  $('#rtl').textContent = 'Repos · ' + label;
  rt = {end: Date.now() + sec * 1000, el};
  const tick = () => {
    if (!rt || rt.el !== el) return;
    const left = Math.ceil((rt.end - Date.now()) / 1000);
    if (left <= 0) {
      $('#rtt').textContent = 'Go !'; $('#rtl').textContent = 'Repos terminé'; el.classList.add('go');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]); beep(); clearInterval(rt.i);
      setTimeout(() => { if (rt && rt.el === el) stopRest(); }, 6000); return;
    }
    $('#rtt').textContent = Math.floor(left / 60) + ':' + pad(left % 60);
  };
  rt.i = setInterval(tick, 250); tick();
  $('#rtm').onclick = () => { if (rt) { rt.end -= 15000; tick(); } };
  $('#rtp').onclick = () => { if (rt) { rt.end += 15000; tick(); } };
  $('#rtx').onclick = stopRest;
}

const SPOTIFY_CLIENT_ID = 'd18da7882f1f4d4590c5237f1343ef58';
const SP = {id: SPOTIFY_CLIENT_ID, scope: 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private user-library-read user-library-modify', redir: () => location.origin + location.pathname};

const spGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const spSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  const v = rnd(48), st = rnd(12);

  const ch = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({client_id: SP.id, response_type: 'code', redirect_uri: SP.redir(), scope: SP.scope, code_challenge_method: 'S256', code_challenge: ch, state: st});

const CATS = [
  {g: 'Haut du corps', items: [['pec', 'Pectoraux'], ['dos', 'Grand dorsal'], ['del', 'Deltoïdes'], ['tra', 'Trapèzes'], ['omo', 'Fixateurs d’omoplate'], ['cou', 'Cou'], ['bra', 'Fléchisseurs des bras'], ['tri', 'Triceps'], ['pfl', 'Fléchisseurs des poignets'], ['pex', 'Extenseurs des poignets']]},
  {g: 'Tronc', items: [['abd', 'Abdominaux'], ['lom', 'Dorso-lombaires']]},
  {g: 'Bas du corps', items: [['qua', 'Quadriceps'], ['ish', 'Ischio-jambiers'], ['add', 'Adducteurs'], ['mol', 'Mollets']]}
];
const CATN = Object.fromEntries(CATS.flatMap(g => g.items));

const gOf = c => CATS.findIndex(g => g.items.some(i => i[0] === c));
function vidInfo(u) {
  try {
    const x = new URL(u), h = x.hostname.replace(/^(www\.|m\.)/, ''); let id = '';
    if (h === 'youtu.be') id = x.pathname.slice(1).split('/')[0];
    else if (/^youtube(-nocookie)?\.com$/.test(h)) id = x.searchParams.get('v') || (x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]+)/) || [])[1] || '';
    if (/^[\w-]{6,15}$/.test(id)) return {yt: id};
    if (h === 'vimeo.com') { const m = x.pathname.match(/\/(\d+)/); if (m) return {vi: m[1]}; }
  } catch (e) {}
  return null;
}
const thumb = u => { const v = okUrl(u) && vidInfo(u); return v && v.yt ? `https://img.youtube.com/vi/${v.yt}/hqdefault.jpg` : ''; };

const exImg = e => /^data:image\/jpeg;base64,[\w+\/=]+$/.test((e && e.img) || '') ? e.img : '';
function readCover(file) {
  return new Promise((ok, ko) => {
    if (!file || !/^image\//.test(file.type)) return ko(new Error('Choisis une image.'));
    const fr = new FileReader();
    fr.onerror = () => ko(new Error('Lecture impossible.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => ko(new Error('Image non lisible.'));
      im.onload = () => {
        const W = 800, H = 450, c = document.createElement('canvas'); c.width = W; c.height = H;
        const k = Math.max(W / im.width, H / im.height), w = im.width * k, h = im.height * k;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
        let q = .8, u = c.toDataURL('image/jpeg', q);
        while (u.length > 120000 && q > .35) { q -= .1; u = c.toDataURL('image/jpeg', q); }
        u.length > 120000 ? ko(new Error('Image trop lourde, essaie-en une autre.')) : ok(u);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function readPage(file) {
  return new Promise((ok, ko) => {
    if (!file || !/^image\//.test(file.type)) return ko(new Error('Choisis une image.'));
    const fr = new FileReader();
    fr.onerror = () => ko(new Error('Lecture impossible.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => ko(new Error('Image non lisible.'));
      im.onload = () => {
        let sc = Math.min(1, 1600 / Math.max(im.width, im.height)), q = .85;
        for (let t = 0; t < 10; t++) {
          const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
          const u = c.toDataURL('image/jpeg', q);
          if (u.length <= 380000) return ok(u);
          if (q > .6) q -= .1; else sc *= .85;
        }
        ko(new Error('Image trop lourde, essaie-en une plus petite.'));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function lightbox(src) {
  const o = document.createElement('div'); o.className = 'lbx';
  o.innerHTML = '<button class="lbc" type="button" aria-label="Fermer">✕</button><div class="lbs"><img alt=""></div><p class="lbh">Touche l’image pour zoomer</p>';
  const im = o.querySelector('img'); im.src = src;
  const kd = e => { if (e.key === 'Escape') close(); }, close = () => { o.remove(); document.removeEventListener('keydown', kd); };
  im.onclick = () => o.classList.toggle('zoom');
  o.querySelector('.lbc').onclick = close;
  document.addEventListener('keydown', kd);
  document.body.appendChild(o);
}

async function purgeSessions(ids) {
  for (const sid of ids) {
    const q = await db.collection('logs').where('sessionId', '==', sid).get();
    for (let i = 0; i < q.docs.length; i += 400) { const bt = db.batch(); q.docs.slice(i, i + 400).forEach(d => bt.delete(d.ref)); await bt.commit(); }
    await db.collection('sessions').doc(sid).delete();
  }
  histCache = {};
}

async function viewSession(id, label) {
  const doc = await db.collection('sessions').doc(id).get();
  if (!doc.exists) { app.innerHTML = '<h1>Séance introuvable</h1>'; return; }
  const s = doc.data();
  const logRef = db.collection('logs').doc(id + '_' + user.uid);
  const mine = Object.assign({done: {}, w: {}, note: '', sets: {}}, (await logRef.get()).data());
  mine.w = mine.w || {}; mine.sets = mine.sets || {};
  // Brouillon local : si l'appli a été quittée avant la fin d'un enregistrement, on récupère ce qui avait été saisi
  const dk = 'wg_draft_' + user.uid + '_' + id; let recovered = false, dirtyAt = 0;
  try { const d = JSON.parse(localStorage.getItem(dk) || 'null'); if (d && d.dirty && d.at > (mine.updatedAt || 0)) { mine.done = d.done || {}; mine.w = d.w || {}; mine.sets = d.sets || {}; mine.note = d.note || ''; recovered = true; } } catch (e) {}
  s.exercises.forEach((e, i) => {
    let a = Array.isArray(mine.sets[i]) ? mine.sets[i].map(String) : null;
    if (!a) { const o = String(mine.w[i] || '').trim(), n = parseLoad(o); a = o ? [n != null ? fmtNum(n) : o] : []; }
    const want = Math.min(12, Math.max(1, parseInt(e.sets) || 3));
    while (a.length < want) a.push('');
    mine.sets[i] = a;
  });
  const rd = i => [...app.querySelectorAll(`[data-sw^="${i}:"]`)].map(x => x.value);
  const sync = i => { const sm = sumSets(mine.sets[i], uOf(s.exercises[i])); if (sm) mine.w[i] = sm; else delete mine.w[i]; };
  const upd = i => { mine.sets[i] = rd(i); sync(i); };
  let tm = null;
  const grab = () => { s.exercises.forEach((e, i) => { if (app.querySelector(`[data-sw^="${i}:"]`)) upd(i); }); if ($('#note')) mine.note = $('#note').value; };
  const stash = () => { dirtyAt = Date.now(); try { localStorage.setItem(dk, JSON.stringify({at: dirtyAt, dirty: true, done: mine.done, w: mine.w, sets: mine.sets, note: mine.note})); } catch (e) {} };   // copie locale immédiate, à chaque modification
  const auto = () => { grab(); stash(); if ($('#ok')) $('#ok').textContent = 'Enregistrement…'; clearTimeout(tm); tm = setTimeout(() => save('auto').catch(() => {}), 400); };
  sessionFlush = () => { clearTimeout(tm); grab(); stash(); save('auto').catch(() => {}); };
  const fill = () => getHistory(user.uid).then(h => {
    s.exercises.forEach((e, i) => {
      const el = app.querySelector(`[data-last="${i}"]`); if (!el) return;

const when = t => new Date(t).toLocaleTimeString(WG.loc, {hour: '2-digit', minute: '2-digit'});
const dayKey = t => new Date(t - new Date(t).getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

const whenShort = t => dayKey(t) === dayKey(Date.now()) ? when(t) : new Date(t).toLocaleDateString(WG.loc, {day: 'numeric', month: 'short'});
const linkify = t => esc(t).replace(/(https:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer nofollow" style="color:inherit;text-decoration:underline">$1</a>');

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ST = {done: 'Terminée', part: 'En cours', miss: 'Manquée', plan: 'Prévue'};
const seg = cur => `<div class="seg"><a href="#/calendrier" class="${cur === 'cal' ? 'on' : ''}">Calendrier</a><a href="#/seances" class="${cur === 'list' ? 'on' : ''}">Liste</a><a href="#/historique" class="${cur === 'hist' ? 'on' : ''}">Historique</a></div>`;

function copyModal(src) {

  q('#cok').onclick = async () => {

let cal = null;
async function calendarPage() {
  app.classList.add('wide');
  const t0 = new Date();
  if (!cal) cal = {y: t0.getFullYear(), m: t0.getMonth(), sel: today()};
  const sessions = await all(), byDay = {}, cache = {};
  sessions.forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  const status = s => { const n = cache[s.id] || 0, tot = s.exercises.length; return tot && n >= tot ? 'done' : n ? 'part' : s.date < today() ? 'miss' : 'plan'; };
  const loadLogs = async () => {
    const pre = `${cal.y}-${pad(cal.m + 1)}`;
    await Promise.all(sessions.filter(s => s.date.startsWith(pre) && !(s.id in cache)).map(async s => {
      try { const d = await db.collection('logs').doc(s.id + '_' + user.uid).get(); cache[s.id] = d.exists ? Object.values(d.data().done || {}).filter(Boolean).length : 0; }
      catch (e) { cache[s.id] = 0; }
    }));
  };
  const go = async dm => {
    cal.m += dm; if (cal.m < 0) { cal.m = 11; cal.y--; } if (cal.m > 11) { cal.m = 0; cal.y++; }
    const pre = `${cal.y}-${pad(cal.m + 1)}`; cal.sel = today().startsWith(pre) ? today() : pre + '-01';
    await loadLogs(); draw();
  };
  const draw = () => {
    if (!$('#app') || !app.classList.contains('wide')) return;
    const first = new Date(cal.y, cal.m, 1), off = (first.getDay() + 6) % 7, dim = new Date(cal.y, cal.m + 1, 0).getDate();
    const cells = Math.ceil((off + dim) / 7) * 7, pre = `${cal.y}-${pad(cal.m + 1)}`;
    const ms = sessions.filter(s => s.date.startsWith(pre)), done = ms.filter(s => status(s) === 'done').length;
    let grid = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(w => `<div class="cw">${w}</div>`).join('');
    for (let i = 0; i < cells; i++) {
      const d = new Date(cal.y, cal.m, 1 - off + i), k = iso(d), list = byDay[k] || [];
      grid += `<button class="cd ${d.getMonth() !== cal.m ? 'other' : ''} ${k === today() ? 'today' : ''} ${k === cal.sel ? 'sel' : ''}" data-d="${k}" aria-label="${esc(fmt(k))}${list.length ? ', ' + list.length + ' séance' + (list.length > 1 ? 's' : '') : ''}"><span class="n">${d.getDate()}</span>
        <span class="dots">${list.slice(0, 3).map(s => `<i class="d ${status(s)}"></i>`).join('')}</span>
        ${list.slice(0, 2).map(s => `<span class="ct ${status(s)}">${esc(s.title)}</span>`).join('')}${list.length > 2 ? `<span class="ct">+${list.length - 2}</span>` : ''}</button>`;
    }
    const sel = byDay[cal.sel] || [], label = dayLabel(new Date(cal.sel + 'T12:00').getTime());
    app.innerHTML = `<h1>Calendrier</h1>${seg('cal')}
      <div class="chead"><h2>${first.toLocaleDateString(WG.loc, {month: 'long', year: 'numeric'})}</h2><button class="alt" id="cprev" aria-label="Mois précédent">‹</button><button class="alt" id="ctoday">Aujourd’hui</button><button class="alt" id="cnext" aria-label="Mois suivant">›</button></div>
      <p class="mute" style="margin:0 0 8px">${ms.length} séance${ms.length > 1 ? 's' : ''} ce mois · ${done} terminée${done > 1 ? 's' : ''}</p>
      <div class="cgrid" id="cg">${grid}</div>
      <div class="leg"><span><i class="d"></i>Prévue</span><span><i class="d done"></i>Terminée</span><span><i class="d part"></i>En cours</span><span><i class="d miss"></i>Manquée</span></div>
      <h2 id="dayp" style="text-transform:capitalize">${esc(label)}</h2>
      ${sel.length ? sel.map(s => { const st = status(s); return `<a class="card item" href="#/seance/${s.id}"><span><b>${esc(s.title)}</b>${sTag(s)}<br><span class="mute">${s.exercises.length} exercices${cache[s.id] ? ' · ' + cache[s.id] + ' faits' : ''}</span></span><b class="st-${st}">${ST[st]}</b></a>`; }).join('') : '<p class="mute">Rien de prévu ce jour.</p>'}
      ${isAdmin ? `<div class="card"><b>Ajouter à ce jour</b><p style="margin:10px 0 0"><a class="btn" href="#/admin/new/${cal.sel}">+ Nouvelle séance</a></p>${sessions.length ? `<label for="cps">Copier une séance existante ici</label><select id="cps">${sessions.map(s => `<option value="${s.id}">${esc(s.title)} — ${esc(fmt(s.date))}</option>`).join('')}</select><p style="margin:10px 0 0"><button class="alt" id="cph">Copier ici</button></p>` : ''}</div>` : ''}`;
    app.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
      cal.sel = b.dataset.d; const d = new Date(cal.sel + 'T12:00');
      if (d.getMonth() !== cal.m) { cal.m = d.getMonth(); cal.y = d.getFullYear(); await loadLogs(); }
      draw(); const p = $('#dayp'); if (p) p.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    });
    $('#cprev').onclick = () => go(-1); $('#cnext').onclick = () => go(1);
    $('#ctoday').onclick = async () => { const n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); cal.sel = today(); await loadLogs(); draw(); };
    if ($('#cph')) $('#cph').onclick = async () => {
      const s = sessions.find(x => x.id === $('#cps').value);
      try { await db.collection('sessions').add({title: s.title, date: cal.sel, ...(SCATS[s.cat] ? {cat: s.cat} : {}), exercises: clone(s.exercises)}); calendarPage(); } catch (e) { alert(e.message); }
    };
    let x0 = null; const g = $('#cg');
    g.ontouchstart = e => { x0 = e.touches[0].clientX; };
    g.ontouchend = e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 70) go(dx < 0 ? 1 : -1); };
  };
  await loadLogs(); draw();
}

const short = d => new Date(d + 'T12:00').toLocaleDateString(WG.loc, {day: 'numeric', month: 'short'});
const parseLoad = w => { const m = /(\d+(?:[.,]\d+)?)\s*kg/i.exec(w) || /(\d+(?:[.,]\d+)?)/.exec(w); return m ? parseFloat(m[1].replace(',', '.')) : null; };
const CARDIO = /tapis|course|running|jogging|footing|marche|v[ée]lo|bike|cycling|elliptique|rameur|rowing machine|stepper|escalier|stair|natation|nage|corde [àa] sauter|saut [àa] la corde|jump rope|hiit|cardio|gainage|planche|plank|[ée]chauffement|[ée]tirement|stretch|yoga|boxe|sprint|airdyne|ski[- ]?erg|assault bike|crossfit|aquabike|trampoline|danse|zumba/i;
const TIMETXT = /\b\d+(?:[.,]\d+)?\s*(?:min|mn|minutes?|sec|secondes?)\b|\b\d+\s*s\b|\b\d+\s*h\b/i;
const isTime = e => !!e && e.min === true;   // kg par défaut : minutes uniquement si la coche « Exercice en minutes » est activée
const uOf = e => isTime(e) ? 'min' : 'kg';
const dispW = (w, u) => u === 'min' ? String(w == null ? '' : w).replace(/\bkg\b/gi, 'min') : w;   // corrige aussi l'affichage des anciennes saisies en kg
const fmtNum = n => String(Math.round(n * 100) / 100).replace('.', ',');
const fmtSet = (v, u) => { v = String(v == null ? '' : v).trim(); return !v ? '—' : /^[\d.,\s]+$/.test(v) ? v + ' ' + (u || 'kg') : v; };
const sumSets = (a, u) => (a || []).some(x => String(x).trim()) ? a.map(x => fmtSet(x, u)).join(' · ') : '';
let histCache = {};

async function logsOf(uid) {
  try {
    return (await db.collection('logs').where('uid', '==', uid).get()).docs.map(d => d.data());
  } catch (e) {
    // anciennes règles Firestore : lecture séance par séance
    const out = [];
    await Promise.all((await all()).map(async s => {
      try { const d = await db.collection('logs').doc(s.id + '_' + uid).get(); if (d.exists) out.push(d.data()); } catch (x) {}
    }));
    return out;
  }
}

async function getHistory(uid, fresh) {
  const c = histCache[uid];
  if (!fresh && c && Date.now() - c.t < 300000) return c.v;
  const [ss, logs] = await Promise.all([all(), logsOf(uid)]);
  const byId = {}; ss.forEach(s => { byId[s.id] = s; });
  const entries = [], done = [];
  logs.forEach(l => {
    const s = byId[l.sessionId]; if (!s) return;
    const n = s.exercises.filter((_, i) => l.done && l.done[i]).length;
    if (n) done.push({date: s.date, id: s.id, title: s.title, n, total: s.exercises.length});
    s.exercises.forEach((e, i) => {
      const st = l.sets && Array.isArray(l.sets[i]) ? l.sets[i].map(x => String(x).trim()) : null, has = st && st.some(Boolean);
      const w = String((l.w || {})[i] || '').trim() || (has ? sumSets(st, uOf(e)) : '');
      if (!w) return;
      const nums = has ? st.map(parseLoad).filter(x => x != null) : [];
      entries.push({date: s.date, id: s.id, title: s.title, name: e.name, unit: uOf(e), key: e.name.trim().toLowerCase(), w, sets: has ? st : null, num: nums.length ? Math.max(...nums) : parseLoad(w), reps: parseInt(e.reps) || null, nsets: parseInt(e.sets) || null});
    });
  });
  const by = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  entries.sort(by); done.sort(by);
  const v = {entries, done};
  histCache[uid] = {t: Date.now(), v};
  return v;
}

function computeStats(done) {
  const dn = k => Math.round(new Date(k + 'T12:00').getTime() / 864e5), t = today();
  const days = [...new Set(done.map(d => d.date))].sort().map(dn), set = new Set(days);
  let cur = 0, c = dn(t); if (!set.has(c)) c--;
  while (set.has(c)) { cur++; c--; }
  let best = 0, run = 0, prev = null;
  days.forEach(n => { run = prev !== null && n === prev + 1 ? run + 1 : 1; prev = n; best = Math.max(best, run); });
  const monday = k => { const d = new Date(k + 'T12:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
  const wc = {}; done.forEach(d => { const k = monday(d.date); wc[k] = (wc[k] || 0) + 1; });
  const m0 = monday(t), bars = [];
  for (let i = 7; i >= 0; i--) { const d = new Date(m0 + 'T12:00'); d.setDate(d.getDate() - 7 * i); const k = iso(d); bars.push({k, n: wc[k] || 0}); }
  let ws = 0; const d = new Date(m0 + 'T12:00'); if (!wc[iso(d)]) d.setDate(d.getDate() - 7);
  while (wc[iso(d)]) { ws++; d.setDate(d.getDate() - 7); }
  return {cur, best, ws, bars, week: wc[m0] || 0, month: done.filter(x => x.date.startsWith(t.slice(0, 7))).length, total: done.length};
}

function lineChart(pts, plain) {
  const W = 320, H = 160, p = {l: 38, r: 12, t: 16, b: 24};
  const vals = pts.map(x => x.num), mn = Math.min(...vals), mx = Math.max(...vals);
  const lo = mn === mx ? mn - 1 : mn - (mx - mn) * .15, hi = mn === mx ? mx + 1 : mx + (mx - mn) * .15;
  const X = i => p.l + (pts.length === 1 ? (W - p.l - p.r) / 2 : i * (W - p.l - p.r) / (pts.length - 1));
  const Y = v => p.t + (hi - v) / (hi - lo) * (H - p.t - p.b);
  const prI = plain ? -1 : vals.indexOf(mx);
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression">
    <line class="lc-grid" x1="${p.l}" x2="${W - p.r}" y1="${Y(mx)}" y2="${Y(mx)}"/><line class="lc-grid" x1="${p.l}" x2="${W - p.r}" y1="${Y(mn)}" y2="${Y(mn)}"/>
    <text class="lc-txt" x="${p.l - 6}" y="${Y(mx) + 3}" text-anchor="end">${fmtNum(mx)}</text>${mx !== mn ? `<text class="lc-txt" x="${p.l - 6}" y="${Y(mn) + 3}" text-anchor="end">${fmtNum(mn)}</text>` : ''}
    ${pts.length > 1 ? `<polyline class="lc-line" points="${pts.map((x, i) => X(i).toFixed(1) + ',' + Y(x.num).toFixed(1)).join(' ')}"/>` : ''}
    ${pts.map((x, i) => `<circle class="${i === prI ? 'lc-pr' : 'lc-dot'}" cx="${X(i).toFixed(1)}" cy="${Y(x.num).toFixed(1)}" r="${i === prI ? 5 : 3.5}"/>`).join('')}
    <text class="lc-txt" x="${p.l}" y="${H - 6}">${short(pts[0].date)}</text>${pts.length > 1 ? `<text class="lc-txt" x="${W - p.r}" y="${H - 6}" text-anchor="end">${short(pts[pts.length - 1].date)}</text>` : ''}
  </svg>`;
}

async function usersPage() {
  let list = [], stats = {}, tab = 'all';
  const STALE = 60 * 864e5, now = Date.now();
  const kind = u => u.blocked ? 'blocked' : (!u.seen || now - u.seen > STALE) ? 'stale' : 'active';
  const load = async () => {
    const [us, lg] = await Promise.all([db.collection('users').get(), db.collection('logs').get()]);
    stats = {};
    lg.docs.forEach(d => { const l = d.data(), c = stats[l.uid] || (stats[l.uid] = {seances: 0, ex: 0}), n = Object.values(l.done || {}).filter(Boolean).length; if (n) { c.seances++; c.ex += n; } });
    list = us.docs.map(d => ({uid: d.id, ...d.data()})).sort((a, b) => (b.seen || 0) - (a.seen || 0));
  };
  const ADM = new Set((await db.collection('admins').get().catch(() => ({docs: []}))).docs.map(d => d.id)); const isAdm = u => ADM.has(u.uid);
  const purge = async us => {
    const refs = [];
    for (const u of us) {
      refs.push(db.collection('users').doc(u.uid)); refs.push(db.collection('astHistory').doc(u.uid));
      (await db.collection('logs').where('uid', '==', u.uid).get()).docs.forEach(d => refs.push(d.ref));
      try { (await db.collection('devices').where('uid', '==', u.uid).get()).docs.forEach(d => refs.push(d.ref)); } catch (e) {}
      (await db.collection('messages').where('uid', '==', u.uid).get()).docs.forEach(d => refs.push(d.ref));
    }
    for (let i = 0; i < refs.length; i += 450) { const b = db.batch(); refs.slice(i, i + 450).forEach(r => b.delete(r)); await b.commit(); }
  };
  const run = async f => { try { await f(); await load(); draw(); } catch (e) { alert(e.message); } };
  await load();
  app.innerHTML = `<h1>Inscrits</h1><div class="seg" id="ut"></div><p class="mute" id="uh"></p>
    <input id="q" type="search" placeholder="Rechercher un nom ou un e-mail" aria-label="Rechercher"><div id="ul" style="margin-top:8px"></div>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), cnt = k => list.filter(u => k === 'all' || kind(u) === k).length;
    $('#ut').innerHTML = [['all', 'Tous'], ['active', 'Actifs'], ['stale', 'Inactifs'], ['blocked', 'Bloqués']].map(([k, t]) => `<a href="#" data-t="${k}" class="${tab === k ? 'on' : ''}">${t} (${cnt(k)})</a>`).join('');
    $('#ut').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); tab = a.dataset.t; draw(); });
    const f = list.filter(u => (tab === 'all' || kind(u) === tab) && ((u.name || '') + ' ' + (u.email || '')).toLowerCase().includes(q));
    const bulk = tab === 'stale' ? f.filter(u => !isAdm(u) && u.uid !== user.uid) : [];
    $('#uh').innerHTML = tab === 'stale' ? `Pas connectés depuis plus de 60 jours.${bulk.length ? ' <button class="del" id="ubulk">Supprimer ces ' + bulk.length + ' comptes</button>' : ''}` : 'Si tu supprimes quelqu’un de Firebase Authentication, supprime-le aussi ici. Pour couper un accès tout de suite, utilise « Bloquer ».';
    $('#ul').innerHTML = f.length ? f.map(u => {
      const st = stats[u.uid] || {seances: 0, ex: 0}, me = u.uid === user.uid;
      return `<div class="card"><div class="usr"><div class="av">${esc((u.name || '?').trim()[0] || '?').toUpperCase()}</div>
        <div style="flex:1;min-width:0"><b>${esc(u.name)}</b>${isAdm(u) ? ' <span class="tag">Admin</span>' : ''}${me ? ' <span class="mute">(toi)</span>' : ''}${u.blocked ? ' <span class="err">Bloqué</span>' : ''}<br>
        <span class="mute" style="overflow-wrap:anywhere">${esc(u.email)}</span><br>
        <span class="mute">Vu ${u.seen ? dayLabel(u.seen).toLowerCase() + ' à ' + when(u.seen) : 'jamais'} · ${st.seances} séance${st.seances > 1 ? 's' : ''} · ${st.ex} exercice${st.ex > 1 ? 's' : ''}</span></div></div>
        ${me || isAdm(u) ? '' : `<p class="row" style="margin:10px 0 0"><a class="btn alt" href="#/messages/${esc(u.uid)}">Message</a><button class="alt" data-bl="${esc(u.uid)}">${u.blocked ? 'Débloquer' : 'Bloquer'}</button><button class="del" data-rm="${esc(u.uid)}">Supprimer</button></p>`}</div>`;
    }).join('') : '<p class="mute">Aucun résultat.</p>';

    $('#inbox').innerHTML = list.length ? list.map(c => `<a class="card item" ${c.unread ? 'style="border-color:var(--acc)"' : ''} href="#/messages/${esc(c.uid)}"><span><b>${esc(c.name)}</b>${c.unread ? `<span class="bd" style="position:static">${c.unread}</span>` : ''}<br><span class="mute">${esc((c.last.from === 'admin' ? 'Toi : ' : '') + c.last.text.slice(0, 80))}</span></span><span class="mute">${whenShort(c.last.createdAt)}</span></a>`).join('') : '<p class="mute">Aucune conversation.</p>';
  };
  $('#mq').oninput = draw;
  pageUnsub = db.collection('messages').onSnapshot(sn => { ms = sn.docs.map(d => d.data()); draw(); }, e => { if ($('#inbox')) $('#inbox').textContent = 'Erreur : ' + e.message; });
}

async function thread(uid, nameHint) {
  const mine = isAdmin ? 'admin' : 'user', other = isAdmin ? 'user' : 'admin', flag = isAdmin ? 'readByAdmin' : 'readByUser';
  let name = nameHint;
  if (isAdmin && !name) { const d = await db.collection('users').doc(uid).get().catch(() => null); name = d && d.exists ? d.data().name : null; }
  app.innerHTML = `${isAdmin ? `<p style="display:flex;gap:4px;flex-wrap:wrap"><a class="link" href="#/messages">← Tous les messages</a><a class="link" href="#/activite/${esc(uid)}">Voir l’activité</a></p>` : ''}<h1 id="tt">${isAdmin ? esc(name || 'Conversation') : 'Messages'}</h1>
  ${isAdmin ? '<p><button class="link" id="delc" hidden>Supprimer la conversation</button></p>' : '<p class="mute">Écris à Alban, sa réponse apparaîtra ici en direct.</p>'}
  <div id="thr"></div>
  <div class="chips" id="qk"></div>
  <div class="comp"><select id="att" aria-label="Joindre une séance" style="flex:none;width:68px;padding:12px 8px"><option value="">Joindre</option></select><textarea id="msg" rows="1" maxlength="1000" placeholder="Écrire un message…" aria-label="Message"></textarea><button id="send">Envoyer</button></div>`;
  let ms = [], first = true;
  const draw = () => {
    const box = $('#thr'); if (!box) return;
    const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 160;
    let last = '';
    box.innerHTML = ms.length ? ms.map(m => {
      const k = dayKey(m.createdAt), sep = k !== last ? `<div class="day">${dayLabel(m.createdAt)}</div>` : ''; last = k;
      const me = m.from === mine, seen = me && (isAdmin ? m.readByUser : m.readByAdmin);
      return `${sep}<div class="bub ${me ? 'me' : 'ot'}">${linkify(m.text)}<small>${when(m.createdAt)}${seen ? ' · Vu' : ''}${me || isAdmin ? ` · <button class="x" data-del="${m.id}">Supprimer</button>` : ''}</small></div>`;
    }).join('') : '<p class="mute">Aucun message pour l’instant.</p>';
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Supprimer ce message ?')) db.collection('messages').doc(b.dataset.del).delete().catch(e => alert(e.message)); });
    if ($('#delc')) $('#delc').hidden = !ms.length;
    if (nearBottom || first) window.scrollTo(0, document.body.scrollHeight);
  };
  pageUnsub = db.collection('messages').where('uid', '==', uid).onSnapshot(sn => {
    ms = sn.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => a.createdAt - b.createdAt);
    if (isAdmin && !name) { const u = ms.find(m => m.from === 'user'); if (u && $('#tt')) { name = u.name; $('#tt').textContent = name; } }
    ms.filter(m => m.from === other && !m[flag]).forEach(m => db.collection('messages').doc(m.id).update({[flag]: true}).catch(() => {}));
    draw(); first = false;
  }, e => { if ($('#thr')) $('#thr').textContent = 'Erreur : ' + e.message; });
  const send = async () => {
    const ta = $('#msg'), text = ta.value.trim(); if (!text) return;
    ta.value = ''; ta.style.height = 'auto';
    try { await db.collection('messages').add({uid, name: name || (isAdmin ? 'Utilisateur' : nm(user)), from: mine, text, createdAt: Date.now(), readByAdmin: isAdmin, readByUser: !isAdmin}); }
    catch (e) { ta.value = text; alert(e.message); }
  };
  $('#send').onclick = send;
  notifAsk($('#thr'));
  if (!isAdmin) {
    $('#qk').innerHTML = ['Séance terminée', 'J’ai une question sur un exercice', 'Je ne peux pas venir aujourd’hui'].map(t => `<button class="alt" data-q="${esc(t)}">${esc(t)}</button>`).join('');
    $('#qk').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const ta = $('#msg'); ta.value = b.dataset.q; ta.focus(); });
  }
  all().then(l => { $('#att').insertAdjacentHTML('beforeend', l.slice(0, 40).map(x => `<option value="${esc(x.id)}">${esc(x.title)} — ${esc(short(x.date))}</option>`).join('')); }).catch(() => {});
  $('#att').onchange = e => { if (!e.target.value) return; const ta = $('#msg'); ta.value = (ta.value ? ta.value + '\n' : '') + location.origin + location.pathname + '#/seance/' + e.target.value; e.target.value = ''; ta.focus(); };
  $('#msg').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; };
  $('#msg').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(hover:hover)').matches) { e.preventDefault(); send(); } };
  if ($('#delc')) $('#delc').onclick = async () => {
    if (!confirm('Supprimer toute la conversation ?')) return;
    const b = db.batch(); ms.forEach(m => b.delete(db.collection('messages').doc(m.id)));
    await b.commit(); location.hash = '#/messages';
  };
}

const addDays = (k, n) => { const d = new Date(k + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const LIM = {name: 80, sets: 10, reps: 20, load: 30, rest: 20, notes: 200, video: 300};
// Catégorie d'une séance : hypertrophie / force / endurance (champ "cat" du document)
const SCATS = {hyper: 'Hypertrophie', force: 'Force', endu: 'Endurance'};
const sTag = s => s && SCATS[s.cat] ? `<span class="scat sc-${s.cat}">${SCATS[s.cat]}</span>` : '';
const sOpts = (v, none) => `<option value="">${none}</option>` + Object.entries(SCATS).map(([k, n]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${n}</option>`).join('');
const parseLines = t => t.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 40).map(l => {
  const [name, sr, load, rest, notes] = l.split('|').map(x => x.trim()), m = /^(\d+)\s*[x×*]\s*(.+)$/i.exec(sr || '');
  return {...blank(), name: name || '', sets: m ? m[1] : '', reps: m ? m[2] : (sr || ''), load: load || '', rest: rest || '', notes: notes || ''};
});
async function editSession(id, preset) {
  let s = {title: '', date: /^\d{4}-\d{2}-\d{2}$/.test(preset || '') ? preset : today(), exercises: [blank()]};
  if (id) { const d = await db.collection('sessions').doc(id).get(); if (d.exists) s = d.data(); }
  else { try { const d = JSON.parse(sessionStorage.getItem('astDraft') || 'null'); if (d && Array.isArray(d.exercises)) { s.title = String(d.title || '').slice(0, 80); s.exercises = d.exercises; } sessionStorage.removeItem('astDraft'); } catch (e) {} }
  s.rep = 1; s.bulk = '';
  const existing = await all(), known = new Set(DEFAULTS);
  existing.forEach(x => x.exercises.forEach(e => known.add(e.name)));
  const field = (i, k, ph, v) => `<input data-i="${i}" data-k="${k}" maxlength="${LIM[k]}" value="${esc(v)}" placeholder="${ph}" aria-label="${ph}">`;
  const draw = () => {
    app.innerHTML = `<h1>${id ? 'Modifier la séance' : 'Nouvelle séance'}</h1>
    <datalist id="exlist">${[...known].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <label for="t">Titre</label><input id="t" maxlength="100" value="${esc(s.title)}" placeholder="Pecs / triceps">
    <label for="d">Date</label><input id="d" type="date" value="${esc(s.date)}">
    <label for="cat">Catégorie</label><select id="cat">${sOpts(s.cat, 'Aucune catégorie')}</select>
    ${id ? '' : `<div class="card"><b>Gagner du temps</b>
      <label for="tpl">Partir d’une séance existante</label><div class="row nowrap"><select id="tpl"><option value="">Choisir…</option>${existing.map(x => `<option value="${esc(x.id)}">${esc(x.title)} — ${esc(fmt(x.date))}</option>`).join('')}</select><button class="alt" id="tplgo" style="flex:none">Charger</button></div>
      <label for="rep">Répéter chaque semaine</label><select id="rep">${[1, 2, 3, 4, 6, 8, 12].map(n => `<option value="${n}" ${n === s.rep ? 'selected' : ''}>${n === 1 ? 'Une seule fois' : n + ' semaines (même jour)'}</option>`).join('')}</select>
      <label for="bulk">Coller une liste d’exercices</label><textarea id="bulk" rows="4" placeholder="Développé couché | 4x10 | 60 kg | 90 s | tempo 3-1-1">${esc(s.bulk)}</textarea>
      <p class="mute" style="margin:4px 0 8px;font-size:14px">Une ligne par exercice : nom | séries x reps | charge | repos | consigne</p><button class="alt" id="bulkgo">Ajouter ces exercices</button></div>`}
    <h2>Exercices (${s.exercises.length})</h2>${s.exercises.map((e, i) => `<div class="card">
      <input data-i="${i}" data-k="name" maxlength="${LIM.name}" list="exlist" value="${esc(e.name)}" placeholder="Nom de l'exercice" aria-label="Nom de l'exercice ${i + 1}">
      <div class="row" style="margin-top:8px">${field(i, 'sets', 'Séries', e.sets)}${field(i, 'reps', 'Reps', e.reps)}${field(i, 'load', 'Charge', e.load)}${field(i, 'rest', 'Repos', e.rest)}</div>
      <div style="margin-top:8px">${field(i, 'notes', 'Consigne (tempo, technique…)', e.notes)}</div>
      <label class="keep"><input type="checkbox" data-min="${i}" ${isTime(e) ? 'checked' : ''}><span>Exercice en minutes (décoché = en kg)</span></label>
      <div style="margin-top:8px"><input type="url" inputmode="url" autocapitalize="off" maxlength="${LIM.video}" data-i="${i}" data-k="video" value="${esc(e.video)}" placeholder="Lien vidéo YouTube ou Vimeo (optionnel)" aria-label="Lien vidéo"></div>
      <p class="row" style="margin:10px 0 0;flex:none"><button class="link" data-up="${i}" ${i ? '' : 'disabled'}>Monter</button><button class="link" data-down="${i}" ${i < s.exercises.length - 1 ? '' : 'disabled'}>Descendre</button><button class="link" data-cp="${i}">Dupliquer</button><button class="link" data-rm="${i}">Retirer</button></p></div>`).join('')}
    <p class="row stick"><button class="alt" id="add">+ Ajouter un exercice</button><button id="sv">Enregistrer la séance</button></p>`;
    const read = () => { s.title = $('#t').value; s.date = $('#d').value; s.cat = $('#cat').value; if ($('#rep')) s.rep = +$('#rep').value; if ($('#bulk')) s.bulk = $('#bulk').value; app.querySelectorAll('[data-k]').forEach(i => s.exercises[i.dataset.i][i.dataset.k] = i.value); };
    const on = (sel, f) => app.querySelectorAll(sel).forEach(b => b.onclick = () => { read(); f(+Object.values(b.dataset)[0]); draw(); });
    const empty = () => s.exercises.length === 1 && !s.exercises[0].name.trim();
    app.querySelectorAll('[data-min]').forEach(c => c.onchange = () => { s.exercises[+c.dataset.min].min = c.checked; });

    if ($('#tplgo')) $('#tplgo').onclick = () => { read(); const t = existing.find(x => x.id === $('#tpl').value); if (!t) return; if (!s.title.trim()) s.title = t.title; if (!s.cat && t.cat) s.cat = t.cat; s.exercises = clone(t.exercises); draw(); };

    on('[data-rm]', i => s.exercises.splice(i, 1));
    on('[data-cp]', i => s.exercises.splice(i + 1, 0, {...s.exercises[i]}));
    on('[data-up]', i => { if (i) [s.exercises[i - 1], s.exercises[i]] = [s.exercises[i], s.exercises[i - 1]]; });
    on('[data-down]', i => { if (i < s.exercises.length - 1) [s.exercises[i + 1], s.exercises[i]] = [s.exercises[i], s.exercises[i + 1]]; });
    $('#sv').onclick = async () => {
      read();
      const ex = s.exercises.filter(e => e.name.trim()).map(e => { const o = {}; Object.keys(LIM).forEach(k => o[k] = String(e[k] || '').trim().slice(0, LIM[k])); o.min = isTime(e); return o; });
      const bad = ex.find(e => e.video && !okUrl(e.video)); if (bad) return alert('Lien vidéo invalide pour « ' + bad.name + ' » : https:// et YouTube ou Vimeo uniquement.');
      if (!s.title.trim() || !ex.length || !/^\d{4}-\d{2}-\d{2}$/.test(s.date)) return alert('Il faut un titre, une date et au moins un exercice.');
      $('#sv').disabled = true;
      const dates = id ? [s.date] : Array.from({length: s.rep || 1}, (_, k) => addDays(s.date, 7 * k));
      const b = db.batch(); let first;
      dates.forEach((d, k) => { const r = id ? db.collection('sessions').doc(id) : db.collection('sessions').doc(); if (!k) first = r.id; b.set(r, {title: s.title.trim().slice(0, 100), date: d, ...(SCATS[s.cat] ? {cat: s.cat} : {}), exercises: clone(ex)}); });
      try { await b.commit(); } catch (e) { $('#sv').disabled = false; return alert(e.message); }
      location.hash = dates.length > 1 ? '#/calendrier' : '#/seance/' + first;
    };
  };
  draw();
}

const safePhoto = p => typeof p === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p) && p.length < 120000 ? p : '';
const av = (u, cls = '') => {
  const ph = safePhoto(u.photo), on = u.uid === (user && user.uid) || isOnline(u.seen);
  return `<span class="av ${cls} ${on ? 'on' : ''}" ${ph ? `style="background-image:url(${ph})"` : ''} aria-hidden="true">${ph ? '' : esc(((u.name || '?')[0] || '?').toUpperCase())}</span>`;
};
const isOnline = ms => ms && Date.now() - ms < 18e4;
const lastSeen = (ms, self) => {
  if (self) return 'En ligne';
  if (!ms) return 'Jamais connecté';
  const d = Date.now() - ms; if (d < 18e4) return 'En ligne';
  const m = Math.round(d / 6e4); if (m < 60) return `Actif il y a ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `Actif il y a ${h} h`;
  const j = Math.round(h / 24); if (j === 1) return 'Actif hier'; if (j < 30) return `Actif il y a ${j} jours`;
  return 'Actif le ' + new Date(ms).toLocaleDateString(WG.loc, {day: 'numeric', month: 'short', year: 'numeric'});
};

// compteur « X s’entraînent » : 1 compte = 1 personne (peu importe le nombre d’onglets ou d’appareils),

let liveT = null, liveRun = () => {};
function liveShow(n) {
  const e = $('#live'); if (!e) return;
  n = Math.max(1, n | 0);
  $('#liveN').textContent = n;
  $('#liveT').textContent = n > 1 ? ' s’entraînent' : ' s’entraîne';
  e.title = e.ariaLabel = n + (n > 1 ? ' personnes s’entraînent' : ' personne s’entraîne') + ' en ce moment';
  e.hidden = false;
}
async function liveCount() {
  const q = db.collection('users').where('seen', '>', Date.now() - 18e4);
  let n;
  if (typeof q.count === 'function') { try { n = (await q.count().get()).data().count; } catch (e) {} }
  if (n === undefined) n = (await q.get()).size;
  return n;
}
function liveSync() {
  clearInterval(liveT); liveT = null;
  const e = $('#live'); if (!e) return;
  if (!user) { e.hidden = true; return; }
  liveRun = async () => { if (!user || document.hidden) return; try { liveShow(await liveCount()); } catch (x) { e.hidden = true; } };
  setTimeout(liveRun, 1500); liveT = setInterval(liveRun, 60000);
}
document.addEventListener('visibilitychange', () => { if (user && !document.hidden) setTimeout(liveRun, 1500); });

// présence : on met à jour "seen" toutes les minutes tant que l'appli est ouverte
let beat = null;

  const ping = () => { if (user && !document.hidden) db.collection('users').doc(user.uid).update({seen: Date.now()}).catch(() => {}); };
  beat = setInterval(ping, 60000);
}
document.addEventListener('visibilitychange', () => { if (user && !document.hidden) db.collection('users').doc(user.uid).update({seen: Date.now()}).catch(() => {}); });

function readPhoto(file) {
  return new Promise((ok, ko) => {
    if (!file || !/^image\//.test(file.type)) return ko(new Error('Choisis une image.'));
    const fr = new FileReader();
    fr.onerror = () => ko(new Error('Lecture impossible.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => ko(new Error('Image non lisible.'));
      im.onload = () => {
        const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
        const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, S, S); x.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
        ok(c.toDataURL('image/jpeg', .82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function parseWeights(txt) {
  const out = [];
  txt.split(/\r?\n/).forEach(line => {
    let date = null, rest = line;
    let m = /(\d{4})-(\d{2})-(\d{2})/.exec(line);
    if (m) { date = m[0]; rest = line.replace(m[0], ' '); }
    else if ((m = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/.exec(line))) { date = `${m[3]}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`; rest = line.replace(m[0], ' '); }
    if (!date) return;
    const n = /(\d{2,3}(?:[.,]\d{1,2})?)/.exec(rest); if (!n) return;
    const kg = parseFloat(n[1].replace(',', '.'));
    if (kg >= 20 && kg <= 300 && !isNaN(new Date(date + 'T12:00'))) out.push({date, kg});
  });
  return out;
}

        const z = fm.z, B = [], hide = st.opts.hide;
        B.push(G(bLabel(c, P, hide ? 'Mon évolution' : 'Poids actuel'), 16));
        B.push(G(hide ? bHero(c, P, cw, many ? sgn(diff) : '0', 'kg', {size: z.hero - 34 * lv, color: P.acc}) : bHero(c, P, cw, fmtNum(last.kg), 'kg', {size: z.hero - 34 * lv, color: P.acc}), 22));
        B.push(G(bText(c, P, cw, many ? (hide ? 'depuis le ' + dlong(first.date) : sgn(diff) + ' kg depuis le ' + dlong(first.date)) : 'Première pesée enregistrée', {size: 34, lines: 2}), 44));
        if (many) B.push(G(bSpark(c, P, cw, pts, {h: z.spark - 24 * lv, showY: !hide, fmtV: v => fmtNum(v) + ' kg'}), 40));
        const sts = [{v: String(rows.length), l: 'Pesées'}, {v: many ? span : '–', l: 'Suivi'}];
        if (!hide && tg) sts.push({v: fmtNum(tg) + ' kg', l: 'Objectif'});
        B.push(bStats(c, P, cw, sts));
        return B;
      }
    });
  }

  function weightGoal(rows) {
    const tg = getTarget(); if (!tg || !rows.length) return;
    const start = rows[0].kg, cur = rows[rows.length - 1].kg, tot = Math.abs(start - tg);
    const frac = tot < .1 ? 1 : Math.min(1, Math.max(0, (start - cur) / (start - tg))), pc = Math.round(frac * 100), reach = frac >= 1;
    const dir = tg < start ? -1 : 1;
    open({
      slug: 'objectif-poids', kicker: 'Objectif', dateText: fmt(rows[rows.length - 1].date),
      opts: [{id: 'hide', label: 'Masquer mes poids exacts', def: false}],
      caption: st => 'Objectif poids : ' + pc + ' % atteint' + (reach ? '' : st.opts.hide ? '' : ' — encore ' + fmtNum(Math.abs(cur - tg)) + ' kg') + '\n' + TAGS,
      build(c, P, cw, fm, st, lv) {
        const z = fm.z, B = [], hide = st.opts.hide;
        B.push(G(bLabel(c, P, 'Objectif poids'), 30));
        B.push(G(bRing(c, P, cw, frac, pc + ' %', reach ? 'objectif atteint' : 'du chemin parcouru', z.ring - 40 * lv), 44));
        const done = Math.max(0, dir < 0 ? start - cur : cur - start), left = Math.abs(cur - tg);
        B.push(bStats(c, P, cw, hide
          ? [{v: fmtNum(done) + ' kg', l: 'Déjà fait'}, {v: reach ? '0 kg' : fmtNum(left) + ' kg', l: 'Reste'}, {v: (dir < 0 ? '−' : '+') + fmtNum(tot) + ' kg', l: 'Objectif'}]
          : [{v: fmtNum(start) + ' kg', l: 'Départ'}, {v: fmtNum(cur) + ' kg', l: 'Actuel'}, {v: fmtNum(tg) + ' kg', l: 'Objectif'}]));
        return B;
      }
    });
  }

  /* ---------- interface : le studio ---------- */
  let cleanup = null;
  function close() { if (cleanup) { cleanup(); cleanup = null; } }
  const canFiles = () => { try { return !!(navigator.share && navigator.canShare && navigator.canShare({files: [new File([''], 'a.png', {type: 'image/png'})]})); } catch (e) { return false; } };

  function open(card) {
    close();
    const opener = document.activeElement, prevOv = document.body.style.overflow;
    const th0 = cloudGet('shrTheme');
    const st = {fmt: FORMATS[cloudGet('shrFmt')] ? cloudGet('shrFmt') : 'story', theme: PAL[th0] && th0 !== 'photo' ? th0 : 'night', photo: null, opts: {name: true, date: true}};
    card.opts.forEach(o => { st.opts[o.id] = o.def; });
    let edited = false; const cap0 = () => card.caption(st);
    const el = document.createElement('div'); el.id = 'shm'; el.className = 'shm';
    const fl = canFiles(), url = location.origin + location.pathname;
    const toggles = [{id: 'name', label: 'Mon prénom'}, {id: 'date', label: 'La date'}].concat(card.opts);
    el.innerHTML = `<div class="shs" role="dialog" aria-modal="true" aria-label="Partager">
      <div class="shp"><div class="shw" id="shw"><canvas id="shc" aria-label="Aperçu de l’image à partager" role="img"></canvas></div></div>
      <div class="shr">
        <div class="shh"><b>Partager</b><button class="alt" id="shx" type="button" aria-label="Fermer">✕</button></div>
        <div class="shb">
          <div class="shl">Format</div>
          <div class="shseg" id="shf">${Object.values(FORMATS).map(f => `<button type="button" data-f="${f.id}" aria-pressed="${f.id === st.fmt}">${f.label}<small>${f.sub}</small></button>`).join('')}</div>
          <div class="shl">Style</div>
          <div class="shth" id="sht">${THEMES.map(([id, n]) => `<button type="button" data-t="${id}" aria-pressed="${id === st.theme}" aria-label="Style ${n}"><i class="sw-${id}"></i>${n}</button>`).join('')}</div>
          <div id="shph" hidden><button class="alt" type="button" id="shpb" style="width:100%;margin-top:10px">Choisir une photo de fond</button><input type="file" id="shfi" accept="image/*" hidden></div>
          <p class="mute shn" id="shsn" hidden>PNG transparent autour de la carte : superpose-le sur ta photo ou ta vidéo (Instagram, TikTok, CapCut…).</p>
          <div class="shl">Afficher</div>
          <div>${toggles.map(o => `<label class="shtg"><input type="checkbox" data-o="${o.id}" ${st.opts[o.id] ? 'checked' : ''}><span class="shsw" aria-hidden="true"></span><span>${esc(o.label)}</span></label>`).join('')}</div>
          <label for="shcap" class="shl" style="margin-top:14px">Légende</label>
          <textarea id="shcap" rows="3" maxlength="600"></textarea>
          <div class="shl">Envoyer le texte à</div>
          <div class="shlk" id="shlk">
            <a target="_blank" rel="noopener noreferrer" data-k="wa">WhatsApp</a><a target="_blank" rel="noopener noreferrer" data-k="tg">Telegram</a><a target="_blank" rel="noopener noreferrer" data-k="x">X</a><a target="_blank" rel="noopener noreferrer" data-k="fb">Facebook</a>
          </div>
          <p class="mute shn">${fl ? 'Instagram, TikTok, Snapchat… : touche « Partager », puis choisis l’appli dans la liste.' : 'Sur ordinateur : enregistre l’image, puis ajoute-la depuis ton téléphone (Instagram, TikTok…).'}</p>
        </div>
        <div class="sha">
          <p class="shm2" id="shmsg" role="status" aria-live="polite"></p>
          <div class="row nowrap"><button type="button" id="shgo" disabled>${fl ? 'Partager…' : 'Enregistrer l’image'}</button>${fl ? '<button type="button" class="alt" id="shdl" disabled>Enregistrer</button>' : ''}<button type="button" class="alt" id="shcp">Copier la légende</button></div>
        </div>
      </div></div>`;
    document.body.appendChild(el); document.body.style.overflow = 'hidden';
    const $q = s => el.querySelector(s), cv = $q('#shc'), msg = t => { $q('#shmsg').textContent = t; };
    const capEl = $q('#shcap'); capEl.value = cap0();
    capEl.oninput = () => { edited = true; links(); };
    function links() {
      const t = encodeURIComponent(capEl.value), u = encodeURIComponent(url);
      const m = {wa: 'https://wa.me/?text=' + encodeURIComponent(capEl.value + '\n' + url), tg: 'https://t.me/share/url?url=' + u + '&text=' + t, x: 'https://x.com/intent/post?text=' + t + '&url=' + u, fb: 'https://www.facebook.com/sharer/sharer.php?u=' + u};
      el.querySelectorAll('#shlk a').forEach(a => { a.href = m[a.dataset.k]; });
    }
    links();

    let blob = null, tok = 0;
    const fname = 'weakgym-' + card.slug + '-' + today() + '.png';
    async function draw() {
      const my = ++tok; blob = null; $q('#shgo').disabled = true; if ($q('#shdl')) $q('#shdl').disabled = true;
      $q('#shw').classList.toggle('chk', st.theme === 'sticker');
      $q('#shph').hidden = st.theme !== 'photo'; $q('#shsn').hidden = st.theme !== 'sticker';
      await ensureFonts(); if (my !== tok) return;
      try { await renderCard(cv, card, st); } catch (e) { msg('Aperçu impossible : ' + e.message); return; }
      if (my !== tok) return;
      cv.toBlob(b => { if (my !== tok) return; blob = b; $q('#shgo').disabled = !b; if ($q('#shdl')) $q('#shdl').disabled = !b; }, 'image/png');
    }
    function download() {
      if (!blob) return; const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); msg('Image enregistrée.');
    }
    async function share() {
      if (!blob) return;
      if (!fl) return download();
      const file = new File([blob], fname, {type: 'image/png'});
      try { await navigator.share({files: [file], text: capEl.value}); msg(''); }
      catch (e) { if (e && e.name !== 'AbortError') msg('Partage impossible ici : enregistre l’image puis ajoute-la dans l’appli.'); }
    }
    async function copy() {
      try { await navigator.clipboard.writeText(capEl.value); msg('Légende copiée.'); }
      catch (e) { capEl.select(); try { document.execCommand('copy'); msg('Légende copiée.'); } catch (x) { msg('Copie impossible : sélectionne le texte à la main.'); } }
    }
    $q('#shgo').onclick = share; $q('#shcp').onclick = copy; if ($q('#shdl')) $q('#shdl').onclick = download; $q('#shx').onclick = close;
    el.addEventListener('click', e => { if (e.target === el) close(); });
    $q('#shf').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; st.fmt = b.dataset.f; cloudSet('shrFmt', st.fmt); el.querySelectorAll('#shf button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); };
    const pick = () => $q('#shfi').click();
    $q('#sht').onclick = e => {
      const b = e.target.closest('[data-t]'); if (!b) return; st.theme = b.dataset.t; if (st.theme !== 'photo') cloudSet('shrTheme', st.theme);
      el.querySelectorAll('#sht button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (st.theme === 'photo' && !st.photo) pick(); draw();
    };
    $q('#shpb').onclick = pick;
    $q('#shfi').onchange = e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      if (!/^image\//.test(f.type) || f.size > 25e6) { msg('Choisis une image de moins de 25 Mo.'); return; }
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => { st.photo = im; draw(); }; im.onerror = () => msg('Image illisible.'); im.src = r.result; };
      r.readAsDataURL(f); e.target.value = '';
    };
    el.querySelectorAll('[data-o]').forEach(i => { i.onchange = () => { st.opts[i.dataset.o] = i.checked; if (!edited) { capEl.value = cap0(); links(); } draw(); }; });

    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') return;
      const f = [...el.querySelectorAll('button:not([disabled]),input:not([type=hidden]):not([hidden]),textarea,a[href]')].filter(x => x.offsetParent !== null);
      if (!f.length) return; const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    };
    document.addEventListener('keydown', onKey, true); addEventListener('hashchange', close);
    cleanup = () => { document.removeEventListener('keydown', onKey, true); removeEventListener('hashchange', close); el.remove(); document.body.style.overflow = prevOv; tok++; if (opener && opener.focus) try { opener.focus(); } catch (e) {} };
    $q('#shx').focus(); draw();
  }

  return {session, record, stats, weekGoal, weight, weightGoal, getTarget, setTarget, close, _render: renderCard, _open: open};
})();
</script>
<script src="notifs.js"></script>
<script src="social.js"></script>
<script src="boutique.js"></script>
<script src="classe.js"></script>
<script>
/* Chronomètre facultatif : bouton ⏱ sur les séances. Il continue même si tu quittes la page ou l'appli. */
(() => {
  const K = 'wg_chrono'; let st = {run: false, t0: 0, acc: 0, laps: []}, open = false;
  try { st = Object.assign(st, JSON.parse(localStorage.getItem(K) || '{}')); } catch (e) {}
  const keep = () => { try { localStorage.setItem(K, JSON.stringify(st)); } catch (e) {} };
  const el = () => st.acc + (st.run ? Date.now() - st.t0 : 0);
  const p2 = n => String(n).padStart(2, '0');
  const fm = ms => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60); return (h ? h + ':' + p2(m) : String(m)) + ':' + p2(t % 60); };
  const box = document.createElement('div'); box.id = 'chr'; box.hidden = true;
  box.innerHTML = '<div class="chp" hidden><div class="chh"><b>Chronomètre</b><button class="x" id="chx" aria-label="Fermer">✕</button></div><div class="cht" id="cht">0:00</div><div class="chb"><button id="chg">Démarrer</button><button class="alt" id="chl">Tour</button><button class="alt" id="chz">Réinit.</button></div><div class="chu" id="chu" hidden><button class="alt" id="chs"></button></div><div class="chlp" id="chlp"></div></div><button class="chf" id="chf" aria-label="Chronomètre">⏱ <span id="chn"></span></button>';
  document.body.appendChild(box);
  const q = s => box.querySelector(s), buzz = () => { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} };
  // exercice « au temps » à faire en premier (affiché en minutes) : c'est lui que le chrono sait remplir
  const target = () => {
    const c = [...document.querySelectorAll('.xc:not(.done)')].filter(a => { const u = a.querySelector('.stu'); return u && u.textContent === 'min'; });
    const art = c.find(a => a.classList.contains('now')) || c[0]; if (!art) return null;
    const ins = [...art.querySelectorAll('[data-sw]')], inp = ins.find(i => !i.value.trim()) || ins[ins.length - 1];
    return inp ? {inp, name: (art.querySelector('.nm') || {}).textContent || '', k: ins.indexOf(inp) + 1} : null;
  };
  const toggle = () => { if (st.run) { st.acc = el(); st.run = false; } else { st.t0 = Date.now(); st.run = true; } keep(); buzz(); draw(); };
  q('#chg').onclick = toggle;
  q('#chl').onclick = () => { if (el() > 0) { st.laps.push(el()); keep(); draw(); } };
  q('#chz').onclick = () => { st = {run: false, t0: 0, acc: 0, laps: []}; keep(); draw(); };
  q('#chx').onclick = () => { open = false; draw(); };
  q('#chf').onclick = () => { open = !open; draw(); };
  q('#chs').onclick = () => {
    const t = target(), v = Math.round(el() / 6000) / 10; if (!t || !(v > 0)) return;
    t.inp.value = fmtNum(v); t.inp.dispatchEvent(new Event('input', {bubbles: true}));   // passe par la sauvegarde automatique
    st = {run: false, t0: 0, acc: 0, laps: []}; keep(); buzz(); draw();
  };
  function draw() {
    const on = typeof user !== 'undefined' && user && (/^#\/seance/.test(location.hash) || st.run || st.acc > 0);
    box.hidden = !on; if (!on) return;
    const e = el(); q('#chf').classList.toggle('run', st.run); q('#chn').textContent = e > 0 || st.run ? fm(e) : '';
    q('.chp').hidden = !open; if (!open) return;
    q('#cht').textContent = fm(e); q('#chg').textContent = st.run ? 'Pause' : e > 0 ? 'Reprendre' : 'Démarrer';
    q('#chlp').innerHTML = st.laps.slice(-6).map((l, i, a) => { const n = st.laps.length - a.length + i + 1, d = l - (n > 1 ? st.laps[n - 2] : 0); return '<div><span>Tour ' + n + '</span><span>' + fm(l) + ' <small>(+' + fm(d) + ')</small></span></div>'; }).reverse().join('');
    const t = target(); q('#chu').hidden = !t; if (t) { q('#chs').textContent = 'Mettre ' + fmtNum(Math.round(e / 6000) / 10) + ' min dans « ' + t.name + ' » (série ' + t.k + ')'; q('#chs').disabled = !(e >= 3000); }
  }
  setInterval(draw, 250); addEventListener('hashchange', draw); draw();
})();
</script>
